name: Network boundary

on:
  push:
    paths:
      - 'apps/server/**'
      - 'apps/client/**'
      - '.env.example'
      - 'manage.sh'
      - 'README.md'
      - 'docs/network-boundaries.md'
      - '.github/workflows/network-boundary.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'apps/client/**'
      - '.env.example'
      - 'manage.sh'
      - 'README.md'
      - 'docs/network-boundaries.md'
      - '.github/workflows/network-boundary.yml'

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Check launcher syntax
        run: bash -n manage.sh
      - name: Install locked server dependencies
        working-directory: apps/server
        run: bun install --frozen-lockfile --no-env-file
      - name: Test and typecheck server without external services
        working-directory: apps/server
        run: |
          bun test --no-env-file
          bunx --no-install tsc --noEmit
      - name: Install locked client dependencies
        working-directory: apps/client
        run: bun install --frozen-lockfile --no-env-file
      - name: Verify Vite binding, Host checks, and API proxy
        working-directory: apps/client
        run: bun test --no-env-file tests/network.test.ts
      - name: Build self-hosted client
        working-directory: apps/client
        run: bun run --no-env-file build
