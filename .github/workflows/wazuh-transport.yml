name: Wazuh transport

on:
  push:
    paths:
      - 'apps/server/**'
      - '.env.example'
      - 'README.md'
      - 'docs/wazuh-tls.md'
      - '.github/workflows/wazuh-transport.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - '.env.example'
      - 'README.md'
      - 'docs/wazuh-tls.md'
      - '.github/workflows/wazuh-transport.yml'

permissions:
  contents: read

jobs:
  transport-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify certificate fixture dependency
        run: openssl version
      - name: Install locked server dependencies
        working-directory: apps/server
        run: bun install --frozen-lockfile --no-env-file
      - name: Test server and actual HTTPS behavior
        working-directory: apps/server
        run: bun test --no-env-file
      - name: Typecheck server and fixtures
        working-directory: apps/server
        run: bunx --no-install tsc --noEmit
