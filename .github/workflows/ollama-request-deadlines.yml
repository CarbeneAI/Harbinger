name: Ollama request deadlines

on:
  pull_request:
    paths:
      - apps/server/**
      - README.md
      - ROADMAP.md
      - docs/ollama-request-deadlines.md
      - .github/workflows/ollama-request-deadlines.yml
  push:
    paths:
      - apps/server/**
      - README.md
      - ROADMAP.md
      - docs/ollama-request-deadlines.md
      - .github/workflows/ollama-request-deadlines.yml

permissions:
  contents: read

jobs:
  deadline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked server dependencies
        working-directory: apps/server
        run: bun install --frozen-lockfile --no-env-file
      - name: Test server behavior and real loopback response-body deadlines
        working-directory: apps/server
        run: bun --no-env-file test
      - name: Typecheck server and fixtures
        working-directory: apps/server
        run: bunx --no-install tsc --noEmit
